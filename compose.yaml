services:
  aprendiz:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      GOOGLE_GENAI_ENABLED: "false"
      GOOGLE_GENAI_USE_VERTEXAI: "false"
      COMPUTER_EXECUTION_BOUNDARY: application_container
    read_only: true
    tmpfs:
      - /app/.runtime:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    init: true
    restart: unless-stopped
