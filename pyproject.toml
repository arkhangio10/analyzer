[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aprendiz"
version = "0.1.0"
description = "Procedural knowledge acquisition from human demonstrations and instructional video."
readme = "README.md"
requires-python = ">=3.12"
# Google ADK and the Cloud SDKs are the intended orchestration and
# infrastructure layers, but nothing imports them yet. They are reinstated
# when the code that uses them lands, so the runtime image stays small and
# its supply-chain surface stays honest about what actually runs.
dependencies = [
  "google-adk",
  "google-cloud-storage",
  "google-genai",
  "fastapi",
  "uvicorn",
  "python-dotenv",
  "pydantic",
  "pydantic-settings",
  "httpx",
  "python-multipart",
  "playwright==1.61.0",
  "clickhouse-connect",
]

[project.optional-dependencies]
dev = ["pytest"]
# Local pose measurement. Kept out of the base dependencies on purpose: these
# two carry a native runtime of their own, and every exported agent installs
# from the same lock. An agent that only replays an approved procedure has no
# use for a pose model, so it does not get one.
pose = ["mediapipe==0.10.35", "opencv-python-headless"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# The browser suite is deliberately outside the default run. Playwright's sync
# API keeps an event loop open for as long as its fixtures live, and that loop
# makes `asyncio.run` fail in every test that follows it in the same process.
# Run it on its own: `pytest tests/browser`.
testpaths = ["tests/unit"]
addopts = "-ra"
