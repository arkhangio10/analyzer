[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aprendiz"
version = "0.1.0"
description = "Procedural knowledge acquisition from human demonstrations and instructional video."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-adk",
  "google-genai",
  "fastapi",
  "uvicorn",
  "python-dotenv",
  "pydantic",
  "pydantic-settings",
  "httpx",
  "python-multipart",
  "playwright==1.61.0",
  "google-cloud-firestore",
  "google-cloud-pubsub",
  "google-cloud-storage",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
