[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aprendiz"
version = "0.1.0"
description = "Procedural knowledge acquisition from human demonstrations and instructional video."
readme = "README.md"
requires-python = ">=3.12"
# Google ADK and the Cloud SDKs are the intended orchestration and
# infrastructure layers, but nothing imports them yet. They are reinstated
# when the code that uses them lands, so the runtime image stays small and
# its supply-chain surface stays honest about what actually runs.
dependencies = [
  "google-genai",
  "fastapi",
  "uvicorn",
  "python-dotenv",
  "pydantic",
  "pydantic-settings",
  "httpx",
  "python-multipart",
  "playwright==1.61.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
